apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scan-test-app
  template:
    metadata:
      labels:
        app: scan-test-app
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          ports:
            - containerPort: 80
